<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mossglen</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ead6;--bg2:#dbe2c6;--sf:#f8f9ee;--sf2:#eef1dd;--tx:#1d2a20;--mu:#5a6a5a;--ac:#8a5a14;--acbg:#efd488;--acbg2:#e3bd55;--ok:#2f6b3f;--ok2:#4a9a5e;--bad:#a63d58;--ln:#c9d0b2;--sh:0 1px 2px rgba(40,60,30,.08),0 4px 14px rgba(40,60,30,.07);--r:14px;
box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--bg2:#10160f;--sf:#212c25;--sf2:#1a241e;--tx:#e6ebd9;--mu:#98a794;--ac:#e6bf55;--acbg:#4a3c14;--acbg2:#6a521a;--ok:#86c694;--ok2:#4f9d63;--bad:#e892a8;--ln:#33443a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b17;--bg2:#10160f;--sf:#212c25;--sf2:#1a241e;--tx:#e6ebd9;--mu:#98a794;--ac:#e6bf55;--acbg:#4a3c14;--acbg2:#6a521a;--ok:#86c694;--ok2:#4f9d63;--bad:#e892a8;--ln:#33443a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:18px/1.5 'Alegreya',Georgia,serif;max-width:640px;margin-inline:auto;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px));min-height:100vh;background:radial-gradient(circle at 12% 0%,var(--bg2) 0,transparent 38%),radial-gradient(circle at 100% 30%,var(--bg2) 0,transparent 30%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:32px;margin:0;letter-spacing:.3px;line-height:1.1;font-weight:700}
h2{font-size:15px;margin:26px 0 8px;text-transform:uppercase;letter-spacing:1.6px;color:var(--ac);font-family:'Alegreya Sans',system-ui,sans-serif;font-weight:700;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.sub{color:var(--mu);font-style:italic;margin:2px 0 12px;font-size:17px;line-height:1.4}
.sans,button,nav{font-family:'Alegreya Sans',system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:16px;gap:10px}
.acorn{font-weight:700;color:var(--ac);background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;font-size:16px;box-shadow:var(--sh);white-space:nowrap;font-family:'Alegreya Sans',system-ui,sans-serif}
.stat{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:var(--r);padding:10px 14px;margin:10px 0 6px;z-index:5;box-shadow:var(--sh)}
.bar{height:9px;background:var(--sf2);border:1px solid var(--ln);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok2),var(--ok));border-radius:999px}
.bar.xp i{background:linear-gradient(90deg,var(--acbg2),var(--ac))}.bar.hp i{background:linear-gradient(90deg,var(--bad),#d4687f)}
.arena{border:1px solid var(--ln);background:var(--sf);border-radius:var(--r);padding:12px 14px;margin:10px 0;box-shadow:var(--sh)}
.arena .nm{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.arena .bar{height:14px}.arena .bar i{transition:width .3s linear}
.hits{margin-top:10px;border-top:1px dashed var(--ln);padding-top:8px;min-height:6.2em;font-size:15px;color:var(--mu);line-height:1.4}
.hits b{color:var(--tx);font-weight:400}
@media (prefers-reduced-motion:reduce){.arena .bar i{transition:none}*{animation:none!important;transition:none!important}}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--sf) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);z-index:20;box-shadow:0 -6px 20px rgba(30,45,30,.08)}
nav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border:0;background:transparent;color:var(--mu);border-radius:12px;font-size:11.5px;font-weight:700;letter-spacing:.2px;transition:background .15s,color .15s}
nav button i{font-style:normal;line-height:1;transition:transform .15s}
nav button.on{background:var(--acbg);color:var(--tx)}
nav button.on i{transform:translateY(-1px) scale(1.06)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:var(--r);padding:11px 14px;margin:7px 0;font-size:17px;line-height:1.3;box-shadow:var(--sh);min-height:48px;transition:border-color .15s,transform .08s,box-shadow .15s}
button.row{cursor:pointer}
button.row:active:not([disabled]){transform:scale(.985)}
.row.on{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok),var(--sh)}
.row[disabled]{opacity:.5;box-shadow:none}
.row small,.mu{color:var(--mu);font-size:15px;display:block;line-height:1.35;margin-top:1px}
.row>span{min-width:0}
.btn{border:1px solid var(--ac);background:linear-gradient(180deg,var(--acbg),var(--acbg2));color:var(--tx);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;min-height:38px;transition:transform .08s,filter .15s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.4)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#log{margin-top:24px;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf2);padding:8px 14px}
#log:empty{display:none}
#log p{margin:6px 0;font-size:15.5px;color:var(--mu);line-height:1.35}
#log p:first-child{color:var(--tx);font-weight:700}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .row{flex-direction:column;align-items:flex-start;justify-content:flex-start;margin:0}
.good{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:15px;min-height:36px;cursor:pointer;transition:background .15s,border-color .15s}
.chips .on{background:var(--acbg);border-color:var(--ac);font-weight:700}
.chips button:disabled{opacity:.4}
b{font-weight:700}
p{margin:6px 0}
.ico{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;overflow:visible}
.ico .f{fill:currentColor;fill-opacity:.17}
.gt .ic{color:var(--ac);height:44px;display:flex;align-items:center}
.gt .ic .ico{width:44px;height:44px}
.gt.q-c .ic{color:var(--ok)}
.gt.q-d .ic{color:#b8860b}
.gt.empty .ic{opacity:.35;color:var(--mu)}
.ri{display:flex;align-items:center;color:var(--ac);flex:none}
.row:has(.ri){justify-content:flex-start}
.row:has(.ri) .btn{margin-left:auto}
nav button i{display:flex;align-items:center;justify-content:center;filter:none;opacity:.75}
nav button.on i{opacity:1}
.gslots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.gt{grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:3px;padding:10px 6px 9px;border:1.5px solid var(--ln);border-radius:var(--r);background:var(--sf);color:var(--tx);box-shadow:var(--sh);min-height:118px;cursor:pointer;transition:transform .08s,border-color .15s;min-width:0}
.gt:active{transform:scale(.97)}
.gt.idle{opacity:.6}
.gt .ic{font-size:26px;line-height:1}
.gt .sl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);font-weight:700}
.gt .nm{font-size:14.5px;line-height:1.15;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.gt .st{font-size:12.5px;color:var(--mu);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.gt.empty{border-style:dashed;background:transparent;box-shadow:none}
.gt.empty .ic{opacity:.4}
.gt.sel{outline:3px solid var(--ac);outline-offset:1px}
.gt.q-c{border-color:var(--ok2)}
.gt.q-d{border-color:#d9a526;background:linear-gradient(180deg,color-mix(in srgb,#f5c542 20%,var(--sf)),var(--sf))}
.gt.q-u{border-color:var(--ac)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:1px 8px;border-radius:999px;border:1px solid var(--ln);color:var(--mu);font-family:'Alegreya Sans',system-ui,sans-serif;vertical-align:middle}
.badge.c{border-color:var(--ok2);color:var(--ok)}
.badge.d,.badge.u{border-color:var(--ac);background:var(--acbg);color:var(--tx)}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:var(--r);padding:9px 14px;margin:0 0 6px}
.chip summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;font-size:16px}
.chip summary::-webkit-details-marker{display:none}
.chip summary em{color:var(--mu);font-size:14px}
.chip[open] summary{margin-bottom:6px}
.chip .mu{font-size:14px}
.fold>summary{list-style:none;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2{display:flex;justify-content:space-between;align-items:center}
.fold>summary h2::after{content:'▸';color:var(--mu);font-size:14px}
.fold[open]>summary h2::after{content:'▾'}
.seg{display:flex;gap:6px;margin:0 0 10px}
.seg button{flex:1;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:var(--r);padding:8px;font:inherit;font-size:15px}
.seg button.on{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
.hero{text-align:center;padding:34px 0 8px}
.hero h1{font-size:44px}
.hero .leaf{font-size:44px;display:block;margin-bottom:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*__GAME__*/
</script>
</body>
</html>
